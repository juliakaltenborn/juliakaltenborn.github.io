---
layout: main
title: Home
---
<div class="columns is-vcentered">
      <div class="column is-one-third content">
        <figure class="image">
          <img src="/assets/images/julia/bio_pic.jpg">
        </figure>
      </div>
      <div class="column is-two-thirds content">
        <h1>{{ site.title }}</h1> 
        {% assign index_page = site.texts | where: "slug", "index" | first %}
        {{ index_page.content | markdownify }}
  </div>
</div>
<div class="content">
  {% assign description_page = site.texts | where: "slug", "description" | first %}
  {{ description_page.content | markdownify }}
</div>
